<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paul Njuabeh — Scan Here</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: 'Raleway', sans-serif;
      padding: 24px;
    }

    .card {
      position: relative;
      background: #1a1a1a;
      border-radius: 28px;
      padding: 48px 44px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      overflow: hidden;
    }

    .card::before, .card::after,
    .card .corner-tl, .card .corner-br {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
    }
    .card::before {
      top: 0; left: 0;
      border-top: 3px solid #c9a84c;
      border-left: 3px solid #c9a84c;
      border-radius: 28px 0 0 0;
    }
    .card::after {
      top: 0; right: 0;
      border-top: 3px solid #c9a84c;
      border-right: 3px solid #c9a84c;
      border-radius: 0 28px 0 0;
    }
    .corner-bl {
      position: absolute;
      bottom: 0; left: 0;
      width: 60px; height: 60px;
      border-bottom: 3px solid #c9a84c;
      border-left: 3px solid #c9a84c;
      border-radius: 0 0 0 28px;
    }
    .corner-br {
      position: absolute;
      bottom: 0; right: 0;
      width: 60px; height: 60px;
      border-bottom: 3px solid #c9a84c;
      border-right: 3px solid #c9a84c;
      border-radius: 0 0 28px 0;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 900;
      color: #d4a843;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 0 0 40px rgba(212, 168, 67, 0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #c9a84c, transparent);
    }
    .divider .star {
      width: 28px;
      height: 28px;
      border: 1.5px solid #c9a84c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .divider .star svg {
      width: 14px;
      height: 14px;
      fill: #c9a84c;
    }
    .divider .diamond {
      width: 7px;
      height: 7px;
      background: #c9a84c;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .qr-wrapper {
      position: relative;
      display: inline-block;
      padding: 20px;
      margin-bottom: 28px;
    }

    .qr-wrapper::before, .qr-wrapper::after,
    .qr-wrapper .br, .qr-wrapper .bl {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
    }
    .qr-wrapper::before  { top: 0;    left: 0;  border-top: 2px solid #c9a84c; border-left:  2px solid #c9a84c; }
    .qr-wrapper::after   { top: 0;    right: 0; border-top: 2px solid #c9a84c; border-right: 2px solid #c9a84c; }
    .qr-wrapper .bl      { bottom: 0; left: 0;  border-bottom: 2px solid #c9a84c; border-left:  2px solid #c9a84c; }
    .qr-wrapper .br      { bottom: 0; right: 0; border-bottom: 2px solid #c9a84c; border-right: 2px solid #c9a84c; }

    .qr-wrapper .dot {
      position: absolute;
      width: 4px; height: 4px;
      background: #c9a84c;
      border-radius: 50%;
    }
    .qr-wrapper .dot.t  { top: -1px; left: 50%; transform: translateX(-50%); }
    .qr-wrapper .dot.b  { bottom: -1px; left: 50%; transform: translateX(-50%); }
    .qr-wrapper .dot.l  { left: -1px; top: 50%; transform: translateY(-50%); }
    .qr-wrapper .dot.r  { right: -1px; top: 50%; transform: translateY(-50%); }

    #qrcode {
      display: block;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
    }
    #qrcode canvas, #qrcode img { display: block; border-radius: 4px; }

    .name-pill {
      display: inline-block;
      background: #d4a843;
      color: #1a1a1a;
      font-family: 'Raleway', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 7px 24px;
      border-radius: 50px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .info {
      font-size: 12px;
      color: rgba(212, 168, 67, 0.55);
      letter-spacing: 0.5px;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .contact-links a {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: color 0.2s;
    }
    .contact-links a:hover { color: #d4a843; }

    .save-btn {
      display: inline-block;
      margin-top: 22px;
      padding: 11px 30px;
      border-radius: 50px;
      background: transparent;
      border: 1.5px solid #c9a84c;
      color: #d4a843;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .save-btn:hover {
      background: #c9a84c;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="corner-bl"></div>
    <div class="corner-br"></div>

    <h1>Scan Here</h1>

    <div class="divider">
      <div class="diamond"></div>
      <div class="line"></div>
      <div class="star">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2l1.5 8.5L22 12l-8.5 1.5L12 22l-1.5-8.5L2 12l8.5-1.5z"/>
        </svg>
      </div>
      <div class="line"></div>
      <div class="diamond"></div>
    </div>

    <div class="qr-wrapper">
      <div class="bl"></div>
      <div class="br"></div>
      <div class="dot t"></div>
      <div class="dot b"></div>
      <div class="dot l"></div>
      <div class="dot r"></div>
      <div id="qrcode"></div>
    </div>

    <div class="name-pill">Paul Njuabeh</div>

    <div class="info">
      Cloud Engineer &nbsp;&middot;&nbsp; Indiana University
    </div>

    <div class="contact-links">
      <a href="tel:+16512799860">+1 (651) 279-9860</a>
      <a href="mailto:paulnjuabeh@gmail.com">paulnjuabeh@gmail.com</a>
    </div>

    <a class="save-btn" id="vcardLink" download="PaulNjuabeh.vcf">Save Contact</a>
  </div>

  <script>
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "FN:Paul Njuabeh",
      "N:Njuabeh;Paul;;;",
      "TEL;TYPE=CELL,VOICE:+16512799860",
      "EMAIL;TYPE=INTERNET:paulnjuabeh@gmail.com",
      "TITLE:Cloud Engineer",
      "ORG:Indiana University",
      "END:VCARD"
    ].join("\r\n");

    new QRCode(document.getElementById("qrcode"), {
      text: vcard,
      width: 200,
      height: 200,
      colorDark: "#1a1a1a",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
    document.getElementById("vcardLink").href = URL.createObjectURL(blob);
  </script>
</body>
</html>
